[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
# --ds is a command-line arg, so it wins over the runtime DJANGO_SETTINGS_MODULE
# env var that docker-compose sets to config.settings.dev for the runserver process.
addopts = -ra --strict-markers --ds=config.settings.test
